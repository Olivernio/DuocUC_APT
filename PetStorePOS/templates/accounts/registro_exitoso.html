{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block content %}
<div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center">
    <div class="alert alert-success text-center" role="alert">
        <h2>{% trans "¡Registro Exitoso!" %}</h2>
        <p>{% blocktrans with first_name=user.first_name %}Gracias, <strong>{{ first_name }}</strong>, tu cuenta ha sido creada correctamente.{% endblocktrans %}</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3">
            {% trans "Iniciar sesión" %}
        </a>
    </div>
</div>
{% endblock %}
