{% load i18n %}
<nav aria-label="{% trans 'Breadcrumb' %}" class="mb-3">
  <ol class="breadcrumb mb-0">
    {% for item in breadcrumb_items %}
      {% if item.active %}
        <li class="breadcrumb-item active" aria-current="page">{{ item.name }}</li>
      {% else %}
        <li class="breadcrumb-item">
          <a href="{{ item.url|default:'#' }}" class="text-decoration-none">{{ item.name }}</a>
        </li>
      {% endif %}
    {% endfor %}
  </ol>
</nav>
